[databases]
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
# scram-sha-256, NOT md5: every role's password is stored SCRAM in pg_authid
# (password_encryption=scram-sha-256). With an md5 userlist PgBouncer can
# authenticate the client but cannot prove itself to the server, so every
# backend connection fails. SCRAM requires the PLAINTEXT password in the
# userlist (0600, root-only, gitignored) so PgBouncer can compute the proof.
auth_type = scram-sha-256
auth_file = /opt/onepercent/ops/pgbouncer/userlist.txt
# Admin console access for SHOW POOLS / SHOW SERVERS (psql -p 6432 pgbouncer).
admin_users = postgres
stats_users = postgres
pool_mode = transaction
default_pool_size = 20
max_client_conn = 200
server_idle_timeout = 300
log_connections = 0
log_disconnections = 0
stats_period = 60

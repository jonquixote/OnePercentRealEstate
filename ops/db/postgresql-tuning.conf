# OnePercent Postgres tuning — one-percent-prod-main (12 vCPU / 23 GB / NVMe).
# Written 2026-07-31 during the migration from 209.50.61.64.
#
# The new box came up on STOCK defaults (shared_buffers 128MB, work_mem 4MB,
# random_page_cost 4). The old server was tuned and that tuning lived only in
# its postgresql.conf, so it died with the box — leaving prod materially slower
# than before the move. This file exists so the tuning is versioned, not folklore.

# shared_buffers must fit well INSIDE oper-postgres.service's MemoryHigh (12G),
# because the cgroup accounts shared memory. Setting it AT MemoryMax put the
# cgroup in permanent reclaim and stalled every new connection (2026-07-31).
shared_buffers = 4GB
effective_cache_size = 14GB

# 32MB matches the old box. The sitemap's two big queries spilled to disk below
# this. Bounded risk: work_mem is PER SORT, so 100 connections x parallel
# workers can multiply it — 32MB against 23GB leaves ample headroom.
work_mem = 32MB

# Index builds and VACUUM. The restore built 197 indexes; 2GB keeps future
# REINDEX/VACUUM off the slow path.
maintenance_work_mem = 1GB

# NVMe, not spinning rust. random_page_cost 4.0 makes the planner irrationally
# seq-scan-happy — the behaviour behind past probe and query blowups on an 11GB
# listings table.
random_page_cost = 1.1
effective_io_concurrency = 200

# 12 cores available (the old box had 2).
max_worker_processes = 12
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# Cheaper WAL on a write-heavy crawl.
wal_compression = on

# pg_stat_statements — REQUIRED by ops/monitoring/db-load-budget.sh, which
# reported "query failed" without it. This is the probe that found every slow
# query in past sessions, so losing it would blind the one signal that has
# repeatedly caught regressions.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top

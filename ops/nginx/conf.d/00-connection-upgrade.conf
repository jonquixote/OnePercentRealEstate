# Websocket upgrade map, required by snippets/proxy-params.conf.
#
# Ubuntu ships this in some nginx.conf variants and not others. The 2026-07-31
# rebuild hit a box without it, and EVERY site config failed to load with
# `unknown "connection_upgrade" variable`. ops/nginx/README.md predicted this;
# shipping it as a conf.d drop-in makes a fresh box work unattended.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

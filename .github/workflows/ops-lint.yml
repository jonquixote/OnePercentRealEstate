# =============================================================================
# ops-lint — static checks for deploy/ops code.
#
# The unit suite says nothing about deploy-time correctness: on 2026-07-24 an
# invalid `systemd-run --scope -p Nice=10` silently aborted the build step of
# every deploy for hours while CI stayed green. This job lints the shell
# scripts and systemd units that actually run production.
# =============================================================================
name: ops-lint

on:
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - '.github/workflows/ops-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/**'
      - '.github/workflows/ops-lint.yml'

jobs:
  ops-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Self-test (each known-bad fixture must be caught)
        run: bash ops/ci/ops-lint.sh --self-test

      - name: Lint ops scripts + systemd units
        run: bash ops/ci/ops-lint.sh
